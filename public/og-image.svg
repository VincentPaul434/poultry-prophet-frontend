<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Poultry Prophet — tala ngayon, linaw sa bawat batch</title>
  <desc id="desc">Isang handler record ang nagsi-sync papunta sa malinaw na batch report.</desc>
  <rect width="1200" height="630" fill="#f7f1e7"/>
  <rect x="36" y="36" width="1128" height="558" rx="48" fill="#173d2a"/>
  <circle cx="1050" cy="90" r="240" fill="#2b7049" opacity=".8"/>
  <circle cx="110" cy="620" r="250" fill="#cc7d2e" opacity=".35"/>
  <g font-family="Arial, sans-serif">
    <rect x="86" y="84" width="58" height="58" rx="18" fill="#f4bf55"/>
    <text x="161" y="121" fill="#ffffff" font-size="27" font-weight="800">Poultry Prophet</text>
    <text x="86" y="255" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-2">Tala ngayon.</text>
    <text x="86" y="330" fill="#f4bf55" font-size="68" font-weight="800" letter-spacing="-2">Linaw sa bawat batch.</text>
    <text x="89" y="382" fill="#c9dfce" font-size="23" font-weight="600">Mag-record kahit offline. Mag-sync kapag may internet.</text>

    <rect x="86" y="455" width="245" height="78" rx="24" fill="#fffdf8"/>
    <text x="111" y="485" fill="#617267" font-size="13" font-weight="700">HANDLER</text>
    <text x="111" y="516" fill="#173d2a" font-size="22" font-weight="800">Mag-record</text>

    <path d="M351 494h68" stroke="#f4bf55" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 14"/>
    <rect x="439" y="455" width="245" height="78" rx="24" fill="#f4bf55"/>
    <text x="464" y="485" fill="#72510e" font-size="13" font-weight="700">SYSTEM</text>
    <text x="464" y="516" fill="#173d2a" font-size="22" font-weight="800">Iproseso</text>

    <path d="M704 494h68" stroke="#a9d6b1" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 14"/>
    <rect x="792" y="455" width="276" height="78" rx="24" fill="#dcebd8"/>
    <text x="817" y="485" fill="#617267" font-size="13" font-weight="700">MANAGER</text>
    <text x="817" y="516" fill="#173d2a" font-size="22" font-weight="800">Suriin ang report</text>
  </g>
</svg>
